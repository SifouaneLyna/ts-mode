<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/template/images/logo.png" />
    <link rel="apple-touch-icon" href="/template/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TS MODE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Amiri:wght@400;700&family=Tajawal:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link
      rel="preconnect"
      href="https://backend-5anz.onrender.com"
      crossorigin
    />
    <link
      id="bootstrap-css"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script>
      /* Pick the language before the first paint: the saved choice, otherwise Arabic.
         Arabic switches the page to right-to-left and loads Bootstrap's RTL stylesheet. */
      try {
        var saved = localStorage.getItem("ts-mode-lang");
        // Arabic for every new visitor; a language chosen with the switcher is remembered
        var L = ["en", "fr", "ar"].indexOf(saved) > -1 ? saved : "ar";
        window.__LANG__ = L;
        document.documentElement.lang = L;
        document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
        if (L === "ar") {
          var bs = document.getElementById("bootstrap-css");
          bs.href = bs.href.replace(
            "bootstrap.min.css",
            "bootstrap.rtl.min.css",
          );
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/template/css/vendor.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper@9/swiper-bundle.min.css"
    />
    <link rel="stylesheet" href="/template/style.css" />
    <link rel="stylesheet" href="/template/theme-override.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
